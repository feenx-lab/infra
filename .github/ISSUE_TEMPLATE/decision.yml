name: Decision Record Proposal
description: Propose or revise an architecture decision
labels: [decision]
body:
  - type: input
    id: adr
    attributes:
      label: Proposed ADR ID/Title
      placeholder: ADR-00X - Title
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem or tradeoff is being addressed?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options Considered
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
    validations:
      required: true
  - type: textarea
    id: consequences
    attributes:
      label: Expected Consequences
