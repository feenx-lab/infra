name: Task
description: Track a concrete, reviewable unit of work
title: "[Task] "
labels: [task]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and out of scope?
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      description: What conditions indicate completion?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / Blockers
