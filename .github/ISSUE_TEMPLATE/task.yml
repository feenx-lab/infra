name: Task
description: Track a focused implementation or documentation task.
title: "task: <short description>"
labels:
  - task
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: In-scope and out-of-scope boundaries.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies / blockers
  - type: textarea
    id: notes
    attributes:
      label: Notes
